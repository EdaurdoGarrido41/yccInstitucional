        <script>
            // Cargar lista de autos
            function cargarAutos(busqueda = "") {
            fetch("listar_autos.php?busqueda=" + encodeURIComponent(busqueda))
                .then(res => res.text())
                .then(html => {
                document.getElementById("contenedor-autos").innerHTML = html;

                // Eventos de los botones
                document.querySelectorAll(".btn-ocultar").forEach(btn => {
                    btn.addEventListener("click", () => actualizarEstatus(btn.dataset.vin, 0, busqueda));
                });

                document.querySelectorAll(".btn-mostrar").forEach(btn => {
                    btn.addEventListener("click", () => actualizarEstatus(btn.dataset.vin, 1, busqueda));
                });
                });
            }

            // Actualizar estatus en BD
            function actualizarEstatus(vin, estatus, busqueda = "") {
                fetch("actualizar_estatus.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: "vin=" + encodeURIComponent(vin) + "&estatus=" + estatus
                })
                .then(res => res.text())
                .then(resp => {
                    console.log(resp);
                    cargarAutos(busqueda); // recargar lista
                });
            }

            // Evento del buscador
            document.getElementById("buscador").addEventListener("input", function() {
                cargarAutos(this.value);
            });

            // Cargar al inicio
            cargarAutos();
        </script>
